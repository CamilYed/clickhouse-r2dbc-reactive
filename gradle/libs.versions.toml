[versions]
junit = "6.1.2"
assertj = "3.27.7"
reactor = "3.7.9"
reactor-netty = "1.2.6"
r2dbc-spi = "1.0.0.RELEASE"
r2dbc-pool = "1.0.2.RELEASE"
clickhouse-client-v2 = "0.10.0"
spotless = "8.7.0"
jacoco = "0.8.15"
sonarqube = "7.3.1.8318"
testcontainers = "2.0.5"
awaitility = "4.3.0"
jspecify = "1.0.0"
slf4j = "2.0.18"
bouncycastle = "1.85"
jmh = "1.37"
jmh-gradle-plugin = "0.7.3"
hdrhistogram = "2.2.2"
spring-jdbc = "7.0.7"

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
jmh = { id = "me.champeau.jmh", version.ref = "jmh-gradle-plugin" }

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

reactor-core = { module = "io.projectreactor:reactor-core", version.ref = "reactor" }
reactor-test = { module = "io.projectreactor:reactor-test", version.ref = "reactor" }
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http", version.ref = "reactor-netty" }
# Deliberately no version.ref: reactor-netty-http already pulls in a matching io.netty:netty-bom
# constraint transitively, and this optional native resolver artifact must resolve to exactly that
# same Netty release or it can fail to load (UnsatisfiedLinkError) or, worse, silently mismatch.
# See CLAUDE_REPRESENTATIVE_BENCHMARK_PLAN.md section 4 - verify the resolved version with
# `./gradlew :clickhouse-r2dbc-reactive-benchmarks:dependencyInsight --dependency netty-resolver-dns
# --configuration jmhRuntimeClasspath` before trusting a macOS benchmark run; add an explicit
# version.ref here only if that verification shows this floats to something unexpected.
netty-resolver-dns-native-macos = { module = "io.netty:netty-resolver-dns-native-macos" }

r2dbc-spi = { module = "io.r2dbc:r2dbc-spi", version.ref = "r2dbc-spi" }
r2dbc-pool = { module = "io.r2dbc:r2dbc-pool", version.ref = "r2dbc-pool" }
# Test-only: the official R2DBC SPI Technology Compatibility Kit (TestKit<T>) - see
# ClickHouseR2dbcSpiCompatibilityTest in clickhouse-r2dbc-reactive-connector. Version-aligned with
# r2dbc-spi itself since it's published from the same repository/release train.
r2dbc-spi-test = { module = "io.r2dbc:r2dbc-spi-test", version.ref = "r2dbc-spi" }

clickhouse-client-v2 = { module = "com.clickhouse:client-v2", version.ref = "clickhouse-client-v2" }

# Test-only: r2dbc-spi-test's TestKit<T> requires a JdbcOperations handle to the same database for
# TCK fixture setup/teardown - see ClickHouseR2dbcSpiCompatibilityTest's Javadoc. Never a production
# dependency of this driver.
spring-jdbc = { module = "org.springframework:spring-jdbc", version.ref = "spring-jdbc" }

hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }

testcontainers-bom = { group = "org.testcontainers", name = "testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { group = "org.testcontainers", name = "testcontainers-junit-jupiter" }
testcontainers-clickhouse = { group = "org.testcontainers", name = "testcontainers-clickhouse" }

awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# Test-only: Netty's SelfSignedCertificate needs a JCE provider capable of generating a
# self-signed cert; the JDK-internal fallback generator doesn't work on every JDK version.
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
