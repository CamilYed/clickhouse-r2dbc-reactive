name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string
      publishing_type:
        description: Central Portal publishing mode
        required: true
        default: USER_MANAGED
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
      deployment_id:
        description: >-
          Resume finalizing a USER_MANAGED release after clicking Publish in Central Portal.
          Paste the deployment ID printed by the earlier run's "Upload bundle to Central Portal"
          step (also visible in that run's job summary/logs) to skip rebuilding and re-uploading
          and jump straight to tagging + creating the GitHub Release. Leave empty for a normal
          release run.
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, and upload release
    runs-on: ubuntu-latest

    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISHING_TYPE: ${{ inputs.publishing_type }}
      RESUME_DEPLOYMENT_ID: ${{ inputs.deployment_id }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Everything below that's gated on RESUME_DEPLOYMENT_ID being empty is the "build, sign, and
      # upload" half of a release. When resuming a USER_MANAGED release after manually clicking
      # Publish in the Central Portal UI, that half already happened in the earlier run - redoing
      # it here would both waste a full build+sign cycle and re-upload the same version's artifacts
      # to Central Portal's /upload endpoint, which creates a brand-new deployment rather than
      # resuming the one that's already VALIDATED/PUBLISHED (and Sonatype rejects re-uploading an
      # already-published version outright). Pass this run's deployment_id input instead to skip
      # straight to polling + tag/release finalization against the existing deployment.
      - name: Set up Java
        if: env.RESUME_DEPLOYMENT_ID == ''
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        if: env.RESUME_DEPLOYMENT_ID == ''
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Make Gradle wrapper executable
        if: env.RESUME_DEPLOYMENT_ID == ''
        run: chmod +x gradlew

      - name: Validate release inputs
        run: |
          set -euo pipefail

          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "Invalid release version: $RELEASE_VERSION"
            exit 1
          fi

          if printf '%s' "$RELEASE_VERSION" | grep -qi 'SNAPSHOT'; then
            echo "Release version must not contain SNAPSHOT: $RELEASE_VERSION"
            exit 1
          fi

          if ! printf '%s' "$PUBLISHING_TYPE" | grep -Eq '^(USER_MANAGED|AUTOMATIC)$'; then
            echo "Invalid publishing type: $PUBLISHING_TYPE"
            exit 1
          fi

          echo "Release version: $RELEASE_VERSION"
          echo "Central Portal publishing type: $PUBLISHING_TYPE"

      - name: Verify root project
        if: env.RESUME_DEPLOYMENT_ID == ''
        run: ./gradlew spotlessCheck clean build jacocoTestReport "-PreleaseVersion=$RELEASE_VERSION" --stacktrace

      - name: Publish signed artifacts to local staging repository
        if: env.RESUME_DEPLOYMENT_ID == ''
        run: ./gradlew publishAllPublicationsToLocalBuildRepository "-PreleaseVersion=$RELEASE_VERSION" --stacktrace

      - name: Create Central Portal bundle
        if: env.RESUME_DEPLOYMENT_ID == ''
        run: |
          set -euo pipefail

          cd build/staging-deploy
          find io -type f | LC_ALL=C sort | zip -@ "../central-bundle-$RELEASE_VERSION.zip"

      - name: Verify Central Portal bundle
        if: env.RESUME_DEPLOYMENT_ID == ''
        run: |
          set -euo pipefail

          BUNDLE="build/central-bundle-$RELEASE_VERSION.zip"
          test -f "$BUNDLE"

          echo "Bundle entries:"
          unzip -Z1 "$BUNDLE" | sort | head -100

          if unzip -Z1 "$BUNDLE" | grep -Eq '(^\./?$|/$)'; then
            echo "Bundle contains directory entries or root ./ entry."
            exit 1
          fi

          if unzip -Z1 "$BUNDLE" | grep -v '^io/github/camilyed/' | grep -q .; then
            echo "Bundle contains entries outside io/github/camilyed."
            unzip -Z1 "$BUNDLE" | grep -v '^io/github/camilyed/'
            exit 1
          fi

          if unzip -Z1 "$BUNDLE" | grep -q 'SNAPSHOT'; then
            echo "Snapshot artifacts found in release bundle."
            exit 1
          fi

          echo "Release bundle:"
          ls -lh "$BUNDLE"

          echo "Staged artifacts:"
          find build/staging-deploy -type f | sort

          ASC_COUNT="$(find build/staging-deploy -name "*.asc" -type f | wc -l | tr -d ' ')"
          POM_COUNT="$(find build/staging-deploy -name "*.pom" -type f | wc -l | tr -d ' ')"
          JAR_COUNT="$(find build/staging-deploy -name "*.jar" -type f | wc -l | tr -d ' ')"

          echo "POM files: $POM_COUNT"
          echo "JAR files: $JAR_COUNT"
          echo "ASC signatures: $ASC_COUNT"

          if [ "$POM_COUNT" -lt 4 ]; then
            echo "Expected at least 4 POM files."
            exit 1
          fi

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "No JAR files found."
            exit 1
          fi

          if [ "$ASC_COUNT" -eq 0 ]; then
            echo "No signature files found."
            exit 1
          fi

      - name: Upload Central Portal bundle artifact
        if: env.RESUME_DEPLOYMENT_ID == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: central-bundle-${{ env.RELEASE_VERSION }}
          path: build/central-bundle-${{ env.RELEASE_VERSION }}.zip

      - name: Upload bundle to Central Portal
        if: env.RESUME_DEPLOYMENT_ID == ''
        id: central-upload
        run: |
          set -euo pipefail

          TOKEN="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"

          DEPLOYMENT_ID="$(
            curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer $TOKEN" \
              --form "bundle=@build/central-bundle-$RELEASE_VERSION.zip;type=application/octet-stream" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=clickhouse-r2dbc-reactive-$RELEASE_VERSION&publishingType=$PUBLISHING_TYPE" \
              | tr -d '\r\n'
          )"

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Central Portal did not return a deployment ID."
            exit 1
          fi

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Central Portal deployment ID: $DEPLOYMENT_ID"
          echo "### Central Portal deployment ID: \`$DEPLOYMENT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "If this is a USER_MANAGED release, save this ID: after clicking Publish in Central" >> "$GITHUB_STEP_SUMMARY"
          echo "Portal, re-run this workflow with the same version and this ID in the" >> "$GITHUB_STEP_SUMMARY"
          echo "\`deployment_id\` input to finalize (tag + GitHub Release) without rebuilding." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Central Portal validation or publication
        id: wait-for-central
        env:
          DEPLOYMENT_ID: ${{ env.RESUME_DEPLOYMENT_ID != '' && env.RESUME_DEPLOYMENT_ID || steps.central-upload.outputs.deployment_id }}
        run: |
          set -euo pipefail

          TOKEN="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"

          for attempt in $(seq 1 120); do
            RESPONSE="$(
              curl --silent --show-error --fail-with-body \
                --request POST \
                --header "Authorization: Bearer $TOKEN" \
                "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID"
            )"

            echo "$RESPONSE"

            STATE="$(
              printf '%s' "$RESPONSE" \
                | python3 -c 'import json, sys; print(json.load(sys.stdin).get("deploymentState", "UNKNOWN"))'
            )"

            echo "Central Portal deployment state: $STATE"

            if [ "$STATE" = "FAILED" ]; then
              echo "Central Portal deployment failed."
              exit 1
            fi

            if [ "$STATE" = "VALIDATED" ] && [ "$PUBLISHING_TYPE" = "USER_MANAGED" ]; then
              echo "Central Portal deployment is validated and waiting for manual Publish."
              echo "Open Central Portal, inspect the deployment, and click Publish when ready."
              echo "final_state=VALIDATED" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$STATE" = "PUBLISHED" ]; then
              echo "Central Portal deployment is published."
              echo "final_state=PUBLISHED" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Waiting for Central Portal. Attempt $attempt/120."
            sleep 15
          done

          echo "Timed out waiting for Central Portal deployment."
          exit 1

      # Everything below only runs once Central Portal has actually PUBLISHED the artifacts - not
      # merely VALIDATED (the USER_MANAGED state where a human still has to click Publish in the
      # Central Portal UI). Tagging/releasing on VALIDATED would let the Git tag and GitHub Release
      # point at a commit whose artifacts aren't actually live on Central yet, breaking the "tag,
      # release, and Central artifact all point at the same, actually-published commit" guarantee
      # this step exists for (ROADMAP.md Phase 7 item 13). For USER_MANAGED releases, once you've
      # clicked Publish in Central Portal, re-run this workflow with the same version and the
      # deployment_id printed by the earlier run's "Upload bundle to Central Portal" step/summary -
      # that resumes polling the existing deployment and runs these steps once it reports
      # PUBLISHED, without rebuilding or re-uploading (see that input's description for why a plain
      # re-run of the whole workflow is unsafe here).
      - name: Create Git tag
        if: steps.wait-for-central.outputs.final_state == 'PUBLISHED'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Extract release notes from CHANGELOG.md
        if: steps.wait-for-central.outputs.final_state == 'PUBLISHED'
        id: release-notes
        run: |
          set -euo pipefail

          # CHANGELOG.md sections are headed "## [X.Y.Z] - ..." or "## [Unreleased] - X.Y.Z (...)".
          # Extract the body between this release's heading and the next "## " heading, so release
          # notes always come from the same file a human reading the repo would read - never
          # hand-retyped and liable to drift from it.
          NOTES_FILE="$(mktemp)"
          awk -v version="$RELEASE_VERSION" '
            /^## / {
              if (in_section) { exit }
              if ($0 ~ "\\[" version "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG.md section found for version $RELEASE_VERSION - add one before releasing."
            exit 1
          fi

          {
            echo "notes<<RELEASE_NOTES_EOF"
            cat "$NOTES_FILE"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.wait-for-central.outputs.final_state == 'PUBLISHED'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release-notes.outputs.notes }}
        run: |
          set -euo pipefail

          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "v$RELEASE_VERSION" \
            --title "v$RELEASE_VERSION" \
            --notes-file release-notes.md
