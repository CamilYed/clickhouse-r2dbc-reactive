name: CI

# The fast PR lane: Spotless, the full unit + real-ClickHouse-integration test suite (against
# whatever BaseClickHouseIntegrationTest's default image resolves to - see that class's Javadoc),
# and SonarCloud, on every push/PR. See nightly.yml for the heavier, scheduled multi-ClickHouse-
# version matrix (ROADMAP.md Phase 7 item 12) that doesn't gate every PR.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build and test
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and generate coverage
        run: ./gradlew clean build jacocoTestReport

      - name: Run SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --info
