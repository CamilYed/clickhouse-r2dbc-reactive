name: Cloud benchmark pipeline

# Phase 10 Stage 1 (see engineering/roadmap-archive.md's "Phase 10 - Cloud benchmark pipeline"):
# a repeatable benchmark environment off the local MacBook M3 Pro, on one standard GitHub-hosted
# runner - the repo is public, so no dedicated runner infrastructure is needed to start.
#
# Which benchmark class runs is selectable (workflow_dispatch `benchmark` input, defaults to
# PublicApiMatchedPoolThroughputBenchmark) - see docs/PERFORMANCE.md's local numbers for why that
# one is the default: poolSize=8, concurrency=8/32/128, the same parameters this workflow's cloud
# numbers are meant to compare against. thisDriver and client-v2 always run in this one job, against
# this one ClickHouse container, on this one runner - never split into separate jobs (see the
# roadmap section's non-negotiable constraint: splitting them would compare two different machines
# under two different sets of noise, not two drivers).
#
# scripts/benchmarks/analyze.py's summary.md/chart generation is currently written specifically for
# PublicApiMatchedPoolThroughputBenchmark's own shape (Throughput mode, ops/s, its
# logLatencySummary log line) - see that script's own docstring. Selecting any other benchmark
# class still runs it and uploads its raw results.json/raw-stdout.log/metadata.json as an artifact,
# but skips the analyze.py step entirely rather than mislabeling a shape it wasn't built to read -
# see the "Analyze results" step below.
#
# Trust model: don't trust an absolute number from a single noisy shared runner - trust the
# thisDriver/client-v2 ratio, repeated across several runs (see scripts/benchmarks/analyze.py's
# summary.md header and the roadmap section for the full rationale).
#
# Two profiles:
#   fast    - 1 fork, 1 warmup iteration. A sanity check ("did it run, no catastrophic
#             regression"), not a number to make a public performance claim from. Cheap enough to
#             also run on a weekly schedule.
#   trusted - 3 forks, 5 warmup iterations, -prof gc,hs_thr, plus a background /proc RSS/thread
#             sampler (scripts/benchmarks/sample-resources.sh) for the whole run. workflow_dispatch
#             only - deliberately never scheduled, so a noisy/slow run is something a human asked
#             for, not unattended.
#
# Phase 11 PR2 (see ROADMAP.md): `-prof hs_thr` (JMH's own HotspotThreadProfiler, JVM/fork-scoped)
# and the /proc-based RSS/thread sampler above exist to answer the open question of whether
# client-v2's throughput edge (docs/performance/results.md's cloud-verified matched-pool result) is
# bought with materially more platform threads/RSS than this driver's bounded, non-blocking pipeline
# uses. The sampler is coarse (whole-run, not per-benchmark-method - see its own header comment for
# why) and its resource-samples.csv section in summary.md is not yet interpreted against a real run's
# numbers; treat it as raw evidence collection for now, not a settled conclusion.
#
# One ClickHouse container for the whole job, not one per JMH fork: BenchmarkEnvironment's default
# (each fork starting its own Testcontainers-managed container) is meant for local development,
# where per-fork isolation matters more than a few seconds of startup cost - see that class's own
# Javadoc. On this workflow's "trusted" profile (3 forks), that default would mean 3 separate
# ClickHouse processes, each paying its own startup/page-cache-cold cost, adding noise to exactly
# the runner-noise problem the trust model above already has to work around. Instead this workflow
# starts one long-lived container via scripts/start-benchmark-clickhouse.sh (the same script local
# "trusted" runs already use, see that script's own comments) and points every fork at it via
# BENCH_CLICKHOUSE_URL - see BenchmarkEnvironment's "External server mode" Javadoc section.
#
# Explicitly out of scope for this workflow (see the roadmap section's "Explicitly out of scope
# for the first PR"): no dedicated VM, no Bencher, no GitHub Pages dashboard, no regression-gate
# thresholds. Raw results.json is never committed to main - the whole result directory just
# uploads as a GitHub Actions artifact.
#
# Runner machine specs (CPU model, core count, RAM) are captured into metadata.json and printed in
# summary.md's environment header - GitHub-hosted `ubuntu-latest` runners are not a fixed spec
# (Actions can hand out different underlying hardware between runs), so a run's own specs are part
# of the trust-model evidence, not just its commit/branch/JDK.
#
# The ClickHouse image is cached across runs via actions/cache (docker save/load) since it's
# otherwise pulled fresh on every run on an ephemeral GitHub-hosted runner - Gradle's own
# dependency/wrapper caching is already handled automatically by gradle/actions/setup-gradle
# below, no extra config needed for that half.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "fast (1 fork, sanity check) or trusted (3 forks, -prof gc)"
        required: true
        type: choice
        options:
          - fast
          - trusted
        default: fast
      benchmark:
        description: >-
          Which JMH benchmark class to run (-Pjmh.includes). Only
          PublicApiMatchedPoolThroughputBenchmark gets a parsed summary.md/charts - everything else
          still runs and uploads its raw results.json, but analyze.py is skipped for it (see this
          file's header comment).
        required: true
        type: choice
        options:
          - PublicApiMatchedPoolThroughputBenchmark
          - DefaultPoolSlowQueryThroughputBenchmark
          - ClientV2ExecutorAggressivenessBenchmark
          - PoolSizeSweepThroughputBenchmark
          - ConnectionPerOperationThroughputBenchmark
          - BoundedPoolConcurrencyBenchmark
          - MatchedPoolThreadsConcurrencyBenchmark
          - ConcurrencyBenchmark
          - StreamingScanBenchmark
          - AggregationBenchmark
          - TransportOnlyStreamingBenchmark
          - DecoderOnlyBenchmark
          - TrivialQueryBenchmark
          - PointQueryBenchmark
          - PublicApiPointQueryBenchmark
          - MixedWorkloadRapidRefreshCancelBenchmark
        default: PublicApiMatchedPoolThroughputBenchmark
  schedule:
    # 05:00 UTC weekly (Monday) - fast profile only, see the schedule step below. Outside typical
    # working hours for this project's contributors, same reasoning as nightly.yml's schedule.
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    name: >-
      Run benchmark (${{ github.event.inputs.profile || 'fast' }},
      ${{ github.event.inputs.benchmark || 'PublicApiMatchedPoolThroughputBenchmark' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install analyze.py dependencies
        # Pinned version (not a floating latest) and --only-binary :all: (refuse to fall back to
        # a source distribution, which could execute an arbitrary setup.py/build script during
        # install) - both flagged by SonarCloud as security-sensitive on the unpinned/source-
        # allowed form of this command.
        run: "pip install --only-binary :all: matplotlib==3.10.9"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve profile
        id: profile
        # schedule events have no `inputs` context at all - only workflow_dispatch does. This is
        # the one place that distinction is resolved, so every later step can just read
        # steps.profile.outputs.name without re-checking github.event_name itself.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "name=fast" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve benchmark
        id: benchmark
        # Same schedule-vs-dispatch distinction as "Resolve profile" above - schedule events have
        # no `inputs` context, so the weekly fast run always stays on the one benchmark analyze.py
        # actually knows how to parse.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "name=PublicApiMatchedPoolThroughputBenchmark" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.benchmark }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set JMH parameters for profile
        id: jmh-params
        run: |
          if [ "${{ steps.profile.outputs.name }}" = "trusted" ]; then
            echo "forks=3" >> "$GITHUB_OUTPUT"
            echo "warmup-iterations=5" >> "$GITHUB_OUTPUT"
            echo "profilers=gc,hs_thr" >> "$GITHUB_OUTPUT"
          else
            echo "forks=1" >> "$GITHUB_OUTPUT"
            echo "warmup-iterations=1" >> "$GITHUB_OUTPUT"
            echo "profilers=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve ClickHouse image tag
        id: clickhouse-image
        # Read out of start-benchmark-clickhouse.sh itself rather than duplicating the tag as a
        # literal here - that script is already the single source of truth this file's header
        # comment points to for keeping the tag in sync with BenchmarkEnvironment.CLICK_HOUSE_IMAGE.
        run: |
          IMAGE="$(grep -m1 '^IMAGE=' scripts/start-benchmark-clickhouse.sh | sed -E 's/IMAGE="([^"]+)"/\1/')"
          echo "tag=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Restore ClickHouse image cache
        # actions/cache, not pinned to a commit SHA like this file's other third-party actions -
        # this sandbox's outbound access couldn't resolve the exact commit for the `v4` tag to
        # verify one. Pin it to a SHA the same way if/when that's convenient to check.
        id: clickhouse-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/clickhouse-image-cache/image.tar
          key: clickhouse-docker-image-${{ steps.clickhouse-image.outputs.tag }}

      - name: Load cached ClickHouse image
        if: steps.clickhouse-image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/clickhouse-image-cache/image.tar

      - name: Start ClickHouse (one container for the whole job)
        # See this file's header comment for why: one server shared by every JMH fork, not one
        # Testcontainers-managed process per fork. BENCH_CLICKHOUSE_HTTP_PORT left at the script's
        # own default (28123) deliberately, so this matches local "trusted" runs exactly. `docker
        # run` pulls the image itself only on a cache miss above - the loaded image already
        # satisfies it otherwise.
        run: bash scripts/start-benchmark-clickhouse.sh

      - name: Save ClickHouse image to cache
        if: steps.clickhouse-image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/clickhouse-image-cache
          docker save "${{ steps.clickhouse-image.outputs.tag }}" -o /tmp/clickhouse-image-cache/image.tar

      - name: Point benchmarks at it
        # BenchmarkEnvironment picks up BENCH_CLICKHOUSE_URL/USER/PASSWORD - see its "External
        # server mode" Javadoc. Written directly here (not parsed from the start script's own
        # human-readable "export ..." output) so this doesn't depend on that output's exact format.
        run: |
          echo "BENCH_CLICKHOUSE_URL=http://localhost:28123" >> "$GITHUB_ENV"
          echo "BENCH_CLICKHOUSE_USER=default" >> "$GITHUB_ENV"
          echo "BENCH_CLICKHOUSE_PASSWORD=" >> "$GITHUB_ENV"

      - name: Wait for ClickHouse to be ready
        # The start script returns as soon as `docker run -d` returns, not once the server inside
        # is actually accepting queries - BenchmarkEnvironment's own readiness check (a SELECT
        # version() call) would otherwise race the container's own startup.
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:28123/ping" >/dev/null; then
              echo "ClickHouse is ready."
              exit 0
            fi
            sleep 2
          done
          echo "ClickHouse did not become ready in time." >&2
          docker logs clickhouse-r2dbc-reactive-benchmark || true
          exit 1

      - name: Run selected benchmark
        # trusted profile also runs scripts/benchmarks/sample-resources.sh in the background for the
        # whole run (Phase 11 PR2, see this file's header comment) - Gradle is backgrounded so the
        # sampler can run alongside it, `tail -f --pid` restores the same live-streamed log a plain
        # foreground `| tee` would have given, and the sampler is stopped once Gradle exits either
        # way (success or failure) so it never outlives this step.
        run: |
          PROFILER_FLAG=""
          if [ -n "${{ steps.jmh-params.outputs.profilers }}" ]; then
            PROFILER_FLAG="-Pjmh.profilers=${{ steps.jmh-params.outputs.profilers }}"
          fi
          if [ "${{ steps.profile.outputs.name }}" = "trusted" ]; then
            ./gradlew :clickhouse-r2dbc-reactive-benchmarks:jmh \
              -Pjmh.includes=${{ steps.benchmark.outputs.name }} \
              -Pjmh.forks=${{ steps.jmh-params.outputs.forks }} \
              -Pjmh.warmupIterations=${{ steps.jmh-params.outputs.warmup-iterations }} \
              $PROFILER_FLAG \
              >raw-stdout.log 2>&1 &
            GRADLE_PID=$!
            tail -f raw-stdout.log --pid="$GRADLE_PID" &
            TAIL_PID=$!
            bash scripts/benchmarks/sample-resources.sh "$GRADLE_PID" resource-samples.csv 2 &
            SAMPLER_PID=$!
            GRADLE_EXIT=0
            wait "$GRADLE_PID" || GRADLE_EXIT=$?
            kill "$SAMPLER_PID" "$TAIL_PID" 2>/dev/null || true
            wait "$SAMPLER_PID" "$TAIL_PID" 2>/dev/null || true
            exit "$GRADLE_EXIT"
          else
            ./gradlew :clickhouse-r2dbc-reactive-benchmarks:jmh \
              -Pjmh.includes=${{ steps.benchmark.outputs.name }} \
              -Pjmh.forks=${{ steps.jmh-params.outputs.forks }} \
              -Pjmh.warmupIterations=${{ steps.jmh-params.outputs.warmup-iterations }} \
              $PROFILER_FLAG \
              2>&1 | tee raw-stdout.log
          fi

      - name: Write run metadata
        run: |
          DRIVER_VERSION="$(./gradlew -q :clickhouse-r2dbc-reactive-connector:properties | awk -F': ' '/^version:/{print $2}')"
          CLIENT_V2_VERSION="$(grep -m1 'clickhouse-client-v2 = ' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          CLICKHOUSE_IMAGE="$(grep -m1 'CLICK_HOUSE_IMAGE =' clickhouse-r2dbc-reactive-benchmarks/src/main/java/io/github/camilyed/clickhouse/r2dbc/benchmarks/BenchmarkEnvironment.java | sed -E 's/.*"([^"]+)".*/\1/')"
          JDK_VERSION="$(java -version 2>&1 | head -n1)"
          OS_NAME="$(uname -s)"
          OS_ARCH="$(uname -m)"
          # GitHub-hosted ubuntu-latest runners aren't a fixed spec - Actions can hand out
          # different underlying hardware between runs - so these go into metadata.json alongside
          # everything else the trust model (see this file's header comment) needs to judge a run.
          CPU_MODEL="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed -E 's/^ +//')"
          CPU_CORES="$(nproc)"
          RAM_GB="$(awk '/MemTotal/{printf "%.0f", $2/1024/1024}' /proc/meminfo)"
          # Built via python3's json module, not a shell heredoc - java -version's own output
          # embeds literal double quotes (e.g. 'openjdk version "21.0.4" ...'), which broke a
          # heredoc-interpolated JSON string outright (unescaped quotes mid-value). Every value
          # here goes through json.dumps, so nothing shell-substituted can break the JSON grammar,
          # regardless of what characters it happens to contain.
          python3 -c '
          import json, os, sys

          json.dump(
              {
                  "profile": sys.argv[1],
                  "benchmark": sys.argv[2],
                  "commitSha": sys.argv[3],
                  "branch": sys.argv[4],
                  "driverVersion": sys.argv[5],
                  "clientV2Version": sys.argv[6],
                  "jdkVersion": sys.argv[7],
                  "osName": sys.argv[8],
                  "osArch": sys.argv[9],
                  "clickHouseImage": sys.argv[10],
                  "forks": int(sys.argv[11]),
                  "warmupIterations": int(sys.argv[12]),
                  "poolSize": 8,
                  "cpuModel": sys.argv[13],
                  "cpuCores": int(sys.argv[14]),
                  "ramGb": int(sys.argv[15]),
                  "runDate": sys.argv[16],
              },
              sys.stdout,
              indent=2,
          )
          ' \
            "${{ steps.profile.outputs.name }}" \
            "${{ steps.benchmark.outputs.name }}" \
            "${{ github.sha }}" \
            "${{ github.ref_name }}" \
            "${DRIVER_VERSION}" \
            "${CLIENT_V2_VERSION}" \
            "${JDK_VERSION}" \
            "${OS_NAME}" \
            "${OS_ARCH}" \
            "${CLICKHOUSE_IMAGE}" \
            "${{ steps.jmh-params.outputs.forks }}" \
            "${{ steps.jmh-params.outputs.warmup-iterations }}" \
            "${CPU_MODEL}" \
            "${CPU_CORES}" \
            "${RAM_GB}" \
            "$(date -u +%Y-%m-%d)" \
            > metadata.json
          cat metadata.json

      - name: Analyze results
        # See this file's header comment: analyze.py's summary.md/chart generation is written
        # specifically for PublicApiMatchedPoolThroughputBenchmark's shape (Throughput mode, ops/s,
        # its logLatencySummary log line) - running it against a different benchmark's results.json
        # would either crash or silently mislabel a shape it wasn't built to read, neither of which
        # is better than just skipping it and shipping the raw data.
        if: steps.benchmark.outputs.name == 'PublicApiMatchedPoolThroughputBenchmark'
        run: |
          RESOURCE_SAMPLES_FLAG=""
          if [ -f resource-samples.csv ]; then
            RESOURCE_SAMPLES_FLAG="--resource-samples-csv resource-samples.csv"
          fi
          python3 scripts/benchmarks/analyze.py \
            --results-json clickhouse-r2dbc-reactive-benchmarks/build/results/jmh/results.json \
            --stdout-log raw-stdout.log \
            --metadata-json metadata.json \
            --out-dir benchmark-results \
            $RESOURCE_SAMPLES_FLAG

      - name: Assemble artifact directory
        run: |
          mkdir -p benchmark-results
          cp clickhouse-r2dbc-reactive-benchmarks/build/results/jmh/results.json benchmark-results/results.json
          cp raw-stdout.log benchmark-results/raw-stdout.log
          cp metadata.json benchmark-results/metadata.json
          # Only present on the trusted profile (see scripts/benchmarks/sample-resources.sh) - not
          # an error if missing on fast, so no existence check failure here.
          if [ -f resource-samples.csv ]; then
            cp resource-samples.csv benchmark-results/resource-samples.csv
          fi

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-results-${{ steps.profile.outputs.name }}-${{ steps.benchmark.outputs.name }}-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 90

      - name: Stop ClickHouse
        # Runs even if an earlier step failed, so a failed run never leaves a container behind on
        # the runner - same reasoning as this repo's other cleanup-in-always() steps.
        if: always()
        run: docker rm -f clickhouse-r2dbc-reactive-benchmark || true
